version: "1"
kind: miner
id: 910
slug: onlookout-weather
protocol: generic
name: OnLookout Weather Forecast
description: >
  Structured weather_forecast miner. Primary source Open Meteo with optional
  secondary fusion. Returns agent ready forecast rows with calibrated confidence
  and risk_flags. Schema locked to OnLookout product response.
base_url: {{ONLOOKOUT_BASE_URL}}

auth:
  type: none

rate_limit_per_sec: 10
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  website: https://docs.telegraphprotocol.com/docs/miners/miner-overview
  documentation: https://open-meteo.com/en/docs
  discord: https://discord.com/invite/telegraphprotocol
  twitter: "@Telegraphprotoc"

endpoints:
  - path: /forecast
    external_path: /v1/forecast
    method: GET
    description: Hourly weather forecast for a latitude and longitude.
    param_map:
      lat: latitude
      lon: longitude

input_schema:
  type: object
  required: [latitude, longitude]
  properties:
    latitude:
      type: number
      minimum: -90
      maximum: 90
    longitude:
      type: number
      minimum: -180
      maximum: 180
    name:
      type: string
      description: Optional human readable location label.
    hours:
      type: integer
      minimum: 1
      maximum: 168
      description: Number of hourly forecast steps to return.
    forecast_days:
      type: integer
      minimum: 1
      maximum: 16

output_schema:
  type: object
  required: [location, as_of, forecast, days, confidence, source, risk_flags, summary, answer, canonical]
  properties:
    location:
      type: object
      required: [lat, lon, name]
      properties:
        lat: { type: number }
        lon: { type: number }
        name: { type: string }
    as_of:
      type: string
      description: ISO 8601 UTC timestamp of response assembly.
    forecast:
      type: array
      items:
        type: object
        required: [time, temp_c, precip_mm, wind_ms, conditions]
        properties:
          time: { type: string }
          temp_c: { type: number }
          precip_mm: { type: number }
          wind_ms: { type: number }
          conditions: { type: string }
    days:
      type: array
      items:
        type: object
        required: [date, label, high_c, low_c, precip_mm, condition]
        properties:
          date: { type: string }
          label: { type: string }
          high_c: { type: number }
          low_c: { type: number }
          precip_mm: { type: number }
          condition: { type: string }
    confidence:
      type: number
      minimum: 0
      maximum: 1
    source:
      type: string
      const: open-meteo+fusion
    risk_flags:
      type: array
      items:
        type: string
    summary:
      type: string
      description: Short human readable forecast summary.
    answer:
      type: string
      description: Semantic forecast answer for agents and scorers.
    canonical:
      type: string
      description: Compact canonical forecast fingerprint.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: answer
    reason_field: summary
  supported_intents:
    - WEATHER_FORECAST

on_chain:
  description: OnLookout weather_forecast snapshot for on chain settlement.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: as_of
        description: ISO 8601 UTC timestamp of forecast assembly.
        source_path: as_of
      - index: 1
        name: location_name
        description: Location name string.
        source_path: location.name
      - index: 2
        name: answer
        description: Semantic forecast answer.
        source_path: answer
      - index: 3
        name: summary
        description: Short forecast summary.
        source_path: summary
      - index: 4
        name: canonical
        description: Compact canonical forecast fingerprint.
        source_path: canonical
    integers:
      - index: 0
        name: temp_c_x100
        description: First hour temperature Celsius times 100.
        source_path: forecast.0.temp_c
        multiplier: 100
      - index: 1
        name: precip_mm_x100
        description: First hour precipitation mm times 100.
        source_path: forecast.0.precip_mm
        multiplier: 100
      - index: 2
        name: wind_ms_x100
        description: First hour wind speed m/s times 100.
        source_path: forecast.0.wind_ms
        multiplier: 100
      - index: 3
        name: confidence_x10000
        description: Confidence 0 to 1 scaled by 10000.
        source_path: confidence
        multiplier: 10000
  request:
    - endpoint: forecast
      method: GET
      query_params:
        latitude: { source: strings.0, type: float }
        longitude: { source: strings.1, type: float }
        hours: { source: numbers.0, type: int, optional: true }
        name: { source: strings.2, optional: true }
